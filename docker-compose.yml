services:
  taskhub.api:
    image: ${DOCKER_REGISTRY-}taskhubapi
    build:
      context: .
      dockerfile: src/API/TaskHub.Api/Dockerfile

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskhub-mssql
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1\" -C || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mssql_data: